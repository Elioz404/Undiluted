[package]
name = "undiluted-enclave"
description = "The Undiluted service packaged for OutLayer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "undiluted-enclave"
path = "src/main.rs"

[dependencies]
outlayer = { version = "0.2", features = ["signing-keys", "encryption-keys"] }
serde_json = "1"
hex = "0.4"
undiluted-envelope = { path = "../envelope" }
undiluted-ledger = { path = "../ledger" }
undiluted-service = { path = "../service" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[workspace]
