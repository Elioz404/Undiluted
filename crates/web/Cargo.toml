[package]
name = "undiluted-web"
description = "The client protocol for browsers: signs, encrypts and verifies, as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
borsh.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
undiluted-attestation.workspace = true
undiluted-domain.workspace = true
undiluted-envelope.workspace = true
undiluted-ledger.workspace = true
undiluted-service.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true

[lints]
workspace = true
