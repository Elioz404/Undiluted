[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/ledger",
    "crates/envelope",
    "crates/service",
    "crates/client",
    "crates/cli",
    "contracts/anchor",
]
exclude = ["crates/enclave"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
borsh = { version = "1", features = ["derive"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
near-sdk = "5.30"
primitive-types = { version = "0.13", default-features = false }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
undiluted-client = { path = "crates/client" }
undiluted-domain = { path = "crates/domain" }
undiluted-envelope = { path = "crates/envelope" }
undiluted-ledger = { path = "crates/ledger" }
undiluted-service = { path = "crates/service" }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
